name: Build CellClaw debug APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/android-apk-build.yml

permissions:
  contents: read

concurrency:
  group: cellclaw-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee app-debug.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cellclaw-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
